name: copy and privacy checks

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Visible copy rules
        run: python3 tests/check_copy.py
      - name: Privacy page
        run: python3 tests/check_privacy.py
